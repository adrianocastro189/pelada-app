name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pelada_test
          POSTGRES_USER: pelada
          POSTGRES_PASSWORD: pelada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Debug files
        run: |
          pwd
          ls -la
          echo "package-lock.json:"
          ls -l package-lock.json || true
          head -20 package-lock.json || true

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://pelada:pelada_test@localhost:5432/pelada_test

      - name: Build
        run: npm run build
