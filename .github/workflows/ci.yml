name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start PostgreSQL (pre-installed on ubuntu-latest)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER pelada WITH PASSWORD 'pelada_test';"
          sudo -u postgres psql -c "CREATE DATABASE pelada_test OWNER pelada;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE pelada_test TO pelada;"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://pelada:pelada_test@localhost:5432/pelada_test

      - name: Build
        run: npm run build
