services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pelada_test
      POSTGRES_USER: pelada
      POSTGRES_PASSWORD: pelada_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelada -d pelada_test"]
      interval: 5s
      timeout: 5s
      retries: 5
